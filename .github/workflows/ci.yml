name: ci
on:
  workflow_dispatch:
  push:
    branches:
      - 'v6'
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/codecept.yml
    with:
      php_versions: '["8.2", "8.3", "8.4", "8.5"]'
